<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কাস্টমার ইস্যু ট্র্যাকার</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .select-row { display: flex; gap: 6px; }
    .select-row select { flex: 1; min-width: 0; }
    .icon-btn {
      width: 42px;
      flex: none;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-btn { background-color: #28a745; }
    .add-btn:hover { background-color: #1e7e34; }
    .del-btn { background-color: #dc3545; }
    .del-btn:hover { background-color: #b02a37; }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button[type="submit"]:hover { background-color: #0056b3; }
    button[type="submit"]:disabled { background-color: #8ab8ee; cursor: not-allowed; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
      .rec { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 13px; word-break: break-word; }
    .rec .acts { margin-top: 6px; display: flex; gap: 6px; }
    .rec button { padding: 5px 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Issue Log Form</h2>
  <form id="issueForm">
    <div class="input-group" style="background:#eef6ff;padding:10px;border-radius:4px;">
      <label for="pasteBox">Customer info paste/upload korun (auto fill hobe):</label>
      <textarea id="pasteBox" rows="4" placeholder="Customer ID: 250484&#10;Username: ...&#10;Mobile: ..."></textarea>
      <input type="file" id="fileIn" accept=".txt" style="margin-top:6px;">
    </div>

    <div class="input-group">
      <label for="customerId">Customer ID <span style="color:red">*</span>:</label>
      <input type="text" id="customerId" name="customerId" required>
    </div>

    <div class="input-group" id="openBox" style="display:none;background:#fff8e1;padding:10px;border-radius:4px;">
      <label for="openRecord">এই Customer-এর খোলা রেকর্ড (End Time নেই):</label>
      <select id="openRecord"><option value="">➕ নতুন রেকর্ড যোগ করুন</option></select>
    </div>

    <div class="input-group">
      <label for="username">Username <span style="color:red">*</span>:</label>
      <input type="text" id="username" name="username" required>
    </div>

    <div class="input-group">
      <label for="password">Password:</label>
      <input type="text" id="password" name="password" autocomplete="off">
    </div>

    <div class="input-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
    </div>

    <div class="input-group">
      <label for="package">Package:</label>
      <input type="text" id="package" name="package">
    </div>

    <div class="input-group">
      <label for="expiryDate">Expiry Date:</label>
      <input type="date" id="expiryDate" name="expiryDate">
    </div>

    <div class="input-group">
      <label for="mobile">Mobile <span style="color:red">*</span>:</label>
      <input type="tel" id="mobile" name="mobile" required>
    </div>

    <div class="input-group">
      <label for="address">Address <span style="color:red">*</span>:</label>
      <input type="text" id="address" name="address" required>
    </div>

    <div class="input-group">
      <label for="onuRx">ONU Rx Power <span style="color:red">*</span>:</label>
      <input type="text" id="onuRx" name="onuRx" placeholder="e.g., -22.5 dBm" required>
    </div>

    <div class="input-group">
      <label for="issues">Issue:</label>
      <div class="select-row">
        <select id="issues" name="issues" required></select>
        <button type="button" class="icon-btn add-btn" id="issuesAdd" title="নতুন Issue যোগ করুন">+</button>
        <button type="button" class="icon-btn del-btn" id="issuesDel" title="সিলেক্ট করা Issue মুছুন">−</button>
      </div>
    </div>

    <div class="input-group">
      <label for="eventTime">Event Time:</label>
      <input type="datetime-local" id="eventTime" name="eventTime" required>
    </div>

    <div class="input-group">
      <label for="endTime">End Time:</label>
      <input type="datetime-local" id="endTime" name="endTime">
    </div>

    <div class="input-group">
      <label for="downTime">Down Time (auto calculate hobe):</label>
      <input type="text" id="downTime" name="downTime">
    </div>

    <div class="input-group">
      <label for="currentStatus">Current Status:</label>
      <select id="currentStatus" name="currentStatus">
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <div class="input-group">
      <label for="remarks">Remarks:</label>
      <div class="select-row">
        <select id="remarks" name="remarks"></select>
        <button type="button" class="icon-btn add-btn" id="remarksAdd" title="নতুন নাম যোগ করুন">+</button>
        <button type="button" class="icon-btn del-btn" id="remarksDel" title="সিলেক্ট করা নাম মুছুন">−</button>
      </div>
    </div>

    <button type="submit" id="submitBtn">Submit Record</button>
    <button type="button" id="cancelEdit" style="display:none;margin-top:8px;width:100%;padding:10px;background:#6c757d;color:#fff;border:none;border-radius:4px;cursor:pointer;">Cancel Edit</button>
  </form>
  <div id="status"></div>

  <hr style="margin:25px 0;">
  <h3 style="text-align:center;color:#333;">Submit kora record</h3>
  <div class="select-row">
    <input type="text" id="searchBox" placeholder="Customer ID / Name diye khujun" style="flex:1;min-width:0;">
    <button type="button" class="icon-btn add-btn" id="searchBtn" style="width:70px;font-size:14px;">Search</button>
  </div>
  <div id="recList"></div>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbz8Ks2mVb3nwiApuZRUTsUn5cxqOmKd0fd5urZzU51Iz8QirBSELuYNJ9ZfqBGKeYKaMw/exec';

  const form = document.getElementById('issueForm');
  const statusText = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const eventTime = document.getElementById('eventTime');
  const endTime = document.getElementById('endTime');
  const downTime = document.getElementById('downTime');

  // ---------- Default list ----------
  const DEFAULT_ISSUES = [
    'Onu red light', 'Onu offline', 'Onu Router offline', 'Dbm High!',
    'Fiber wire cut', 'Connected no internet issue', 'onu no power',
    'router issue', 'Onu Online Router Offline', 'Onu Only power LED visible',
    'router red light', 'Intermittent Disconnection', 'room shifting',
    'client end check korte hobe', 'Short Cable Issue', 'router to tv connection'
  ];
  const DEFAULT_REMARKS = [
    'Ali-Nur', 'Forid', 'mamun', 'sonia', 'Ahad', 'Didar', 'Choya', 'amena'
  ];

  // ---------- Dropdown + / − ----------
  function loadList(key, defaults) {
    try {
      const saved = JSON.parse(localStorage.getItem(key));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return defaults.slice();
  }
  function saveList(key, list) {
    try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
  }

  function setupDropdown(selectId, addId, delId, storageKey, defaults, noun) {
    const select = document.getElementById(selectId);
    let list = loadList(storageKey, defaults);

    function render(selected) {
      select.innerHTML = '';
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '-- Select --';
      select.appendChild(ph);
      list.forEach(item => {
        const o = document.createElement('option');
        o.value = item;
        o.textContent = item;
        select.appendChild(o);
      });
      select.value = selected || '';
    }

    document.getElementById(addId).addEventListener('click', () => {
      const val = (prompt('নতুন ' + noun + ' লিখুন:') || '').trim();
      if (!val) return;
      const exists = list.find(x => x.toLowerCase() === val.toLowerCase());
      if (exists) {
        alert('এটি আগে থেকেই আছে।');
        render(exists);
        return;
      }
      list.push(val);
      saveList(storageKey, list);
      render(val);
    });

    document.getElementById(delId).addEventListener('click', () => {
      const val = select.value;
      if (!val) { alert('আগে মুছতে চাওয়া ' + noun + ' সিলেক্ট করুন।'); return; }
      if (!confirm('"' + val + '" মুছে ফেলবেন?')) return;
      list = list.filter(x => x !== val);
      saveList(storageKey, list);
      render('');
    });

    render('');
  }

  setupDropdown('issues', 'issuesAdd', 'issuesDel', 'issueOptions', DEFAULT_ISSUES, 'Issue');
  setupDropdown('remarks', 'remarksAdd', 'remarksDel', 'remarkOptions', DEFAULT_REMARKS, 'নাম');

  // ---------- Down Time auto calculate ----------
  function updateDownTime() {
    if (eventTime.value && endTime.value) {
      const diff = new Date(endTime.value) - new Date(eventTime.value);
      if (diff < 0) {
        endTime.setCustomValidity('End Time, Event Time-er por hote hobe');
        endTime.reportValidity();
        downTime.value = '';
        return;
      }
      endTime.setCustomValidity('');
      const mins = Math.round(diff / 60000);
      downTime.value = Math.floor(mins / 60) + ' hours ' + (mins % 60) + ' minutes';
    } else {
      endTime.setCustomValidity('');
    }
  }
  eventTime.addEventListener('change', updateDownTime);
  endTime.addEventListener('change', updateDownTime);

  // ---------- Purano open record khoja ----------
  const openBox = document.getElementById('openBox');
  const openSel = document.getElementById('openRecord');
  const cid = document.getElementById('customerId');
  const issuesSel = document.getElementById('issues');
  const NEW_OPT = '<option value="">➕ নতুন রেকর্ড যোগ করুন</option>';
  let openRecords = [];
  let editRow = null, editOrigId = '';

  const REQUIRED_NEW = ['username', 'mobile', 'address', 'onuRx'];
  function setUpdateMode(on) {
    eventTime.readOnly = on;
    issuesSel.disabled = on;
    REQUIRED_NEW.forEach(id => { document.getElementById(id).required = !on; });
  }
  function resetOpenBox() {
    openRecords = [];
    openSel.innerHTML = NEW_OPT;
    openBox.style.display = 'none';
    setUpdateMode(false);
  }

  cid.addEventListener('change', async () => {
    if (editRow) return;
    resetOpenBox();
    const id = cid.value.trim();
    if (!id) return;
    try {
      const r = await fetch(scriptURL + '?action=find&customerId=' + encodeURIComponent(id), { cache: 'no-store' });
      const found = await r.json();
      openRecords = Array.isArray(found) ? found : [];
      openRecords.forEach((rec, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = rec.eventTime.replace('T', ' ') + ' — ' + rec.issue;
        openSel.appendChild(o);
      });
      if (openRecords.length) openBox.style.display = 'block';
    } catch (err) { console.error(err); }
  });

  openSel.addEventListener('change', () => {
    const rec = openRecords[openSel.value];
    if (!rec) { setUpdateMode(false); return; }
    setUpdateMode(true);
    eventTime.value = rec.eventTime;
    if (![...issuesSel.options].some(o => o.value === rec.issue)) issuesSel.add(new Option(rec.issue, rec.issue));
    issuesSel.value = rec.issue;
    document.getElementById('currentStatus').value = rec.status || 'Open';
    updateDownTime();
  });

  // ---------- Paste / upload diye auto fill ----------
  const pasteBox = document.getElementById('pasteBox');
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const LABELS = { 'customer id': 'customerId', 'customer': 'customerId', 'username': 'username', 'user name': 'username',
    'password': 'password', 'name': 'name', 'package': 'package', 'expiry date': 'expiryDate', 'expiry': 'expiryDate',
    'mobile': 'mobile', 'phone': 'mobile', 'address': 'address', 'onu rx power': 'onuRx', 'onu rx': 'onuRx' };

  function toIsoDate(s) {
    const m = s.match(/(\d{1,2})[\/\-\s]([A-Za-z]{3,9}|\d{1,2})[\/\-\s](\d{2,4})/);
    if (!m) return '';
    const mon = isNaN(m[2]) ? MON[m[2].slice(0, 3).toLowerCase()] : +m[2];
    let y = +m[3]; if (y < 100) y += 2000;
    return mon ? y + '-' + String(mon).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0') : '';
  }

  function fillFromText(text) {
    let n = 0;
    text.split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*([A-Za-z ]+?)\s*:\s*(.*)$/);
      if (!m) return;
      const id = LABELS[m[1].trim().toLowerCase()];
      if (!id) return;
      let v = m[2].replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').trim();
      if (id === 'expiryDate') v = toIsoDate(v);
      if (v && v !== '-') { document.getElementById(id).value = v; n++; }
    });
    if (n) {
      statusText.style.color = 'green';
      statusText.textContent = n + ' ta field auto fill hoyeche';
      if (!editRow) cid.dispatchEvent(new Event('change'));
    }
  }
  pasteBox.addEventListener('input', () => fillFromText(pasteBox.value));
  document.getElementById('fileIn').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    pasteBox.value = await f.text();
    fillFromText(pasteBox.value);
  });

  // ---------- Submit kora record: list / edit / delete ----------
  const recList = document.getElementById('recList');
  const searchBox = document.getElementById('searchBox');
  const cancelBtn = document.getElementById('cancelEdit');
  const pwd = document.getElementById('password');

  function mkBtn(t, bg, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t; b.style.background = bg; b.onclick = fn;
    return b;
  }
  function setSel(sel, val) {
    if (val && ![...sel.options].some(o => o.value === val)) sel.add(new Option(val, val));
    sel.value = val || '';
  }

  async function loadList() {
    recList.textContent = 'লোড হচ্ছে...';
    try {
      const r = await fetch(scriptURL + '?action=list&q=' + encodeURIComponent(searchBox.value.trim()), { cache: 'no-store' });
      const list = await r.json();
      if (!Array.isArray(list)) throw new Error('Server theke ashol list ashe nai: ' + JSON.stringify(list).slice(0, 150));
      recList.textContent = '';
      if (!list.length) { recList.textContent = 'কোনো রেকর্ড পাওয়া যায়নি।'; return; }
      list.forEach(rec => {
        const div = document.createElement('div');
        div.className = 'rec';
        div.textContent = [rec.customerId, rec.name, rec.eventTime.replace('T', ' '), rec.issue, rec.status].filter(Boolean).join(' • ');
        const acts = document.createElement('div');
        acts.className = 'acts';
        acts.append(mkBtn('Edit', '#007bff', () => startEdit(rec)), mkBtn('Delete', '#dc3545', () => deleteRec(rec)));
        div.appendChild(acts);
        recList.appendChild(div);
      });
    } catch (err) { recList.textContent = 'লিস্ট লোড হয়নি: ' + err.message; }
  }

  function startEdit(rec) {
    resetOpenBox();
    editRow = rec.row; editOrigId = rec.customerId;
    cid.value = rec.customerId;
    ['username', 'name', 'package', 'expiryDate', 'mobile', 'address', 'onuRx'].forEach(id => { document.getElementById(id).value = rec[id] || ''; });
    pwd.value = '';
    pwd.placeholder = 'ফাঁকা রাখলে আগের পাসওয়ার্ড থাকবে';
    setSel(issuesSel, rec.issue);
    eventTime.value = rec.eventTime; endTime.value = rec.endTime; downTime.value = rec.downTime;
    document.getElementById('currentStatus').value = rec.status || 'Open';
    setSel(document.getElementById('remarks'), rec.remarks);
    document.getElementById('submitBtn').textContent = 'Save Changes';
    cancelBtn.style.display = 'block';
    statusText.style.color = '#b45309';
    statusText.textContent = 'Edit mode: ' + rec.customerId;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editRow = null; editOrigId = '';
    form.reset();
    endTime.setCustomValidity('');
    document.getElementById('submitBtn').textContent = 'Submit Record';
    cancelBtn.style.display = 'none';
    pwd.placeholder = '';
    statusText.textContent = '';
    resetOpenBox();
  }
  cancelBtn.addEventListener('click', cancelEdit);

  async function deleteRec(rec) {
    if (!confirm(rec.customerId + ' (' + rec.eventTime.replace('T', ' ') + ') রেকর্ডটি মুছে ফেলবেন?')) return;
    statusText.style.color = 'blue';
    statusText.textContent = 'মুছছে...';
    try {
      const r = await fetch(scriptURL, { method: 'POST', body: new URLSearchParams({
        action: 'delete', row: rec.row, customerId: rec.customerId, origId: rec.customerId }) });
      const t = await r.text();
      if (!t.startsWith('Success')) throw new Error(t);
      statusText.style.color = 'green';
      statusText.textContent = 'রেকর্ড মুছে ফেলা হয়েছে';
      loadList();
    } catch (err) {
      statusText.style.color = 'red';
      statusText.textContent = 'ত্রুটি: ' + err.message;
    }
  }
  document.getElementById('searchBtn').addEventListener('click', loadList);
  searchBox.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadList(); } });

  // ---------- Submit ----------
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const rec = editRow ? null : openRecords[openSel.value];
    const data = new URLSearchParams(new FormData(form));
    data.set('customerId', cid.value.trim());
    data.set('eventTime', eventTime.value);
    if (editRow) {
      data.set('action', 'edit');
      data.set('row', editRow);
      data.set('origId', editOrigId);
      data.set('issues', issuesSel.value);
    } else if (rec) {
      data.set('action', 'update');
      data.set('row', rec.row);
      data.set('issues', rec.issue);
    } else {
      data.set('action', 'insert');
    }

    submitBtn.disabled = true;
    statusText.style.color = 'blue';
    statusText.textContent = 'ডেটা সেভ হচ্ছে...';
    try {
      const r = await fetch(scriptURL, { method: 'POST', body: data });
      const t = await r.text();
      if (!t.startsWith('Success')) throw new Error(t);
      const msg = editRow ? 'রেকর্ড এডিট হয়েছে!' : rec ? 'পুরনো রেকর্ড আপডেট হয়েছে!' : 'সফলভাবে রেকর্ড যোগ হয়েছে!';
      if (editRow) cancelEdit();
      else { form.reset(); endTime.setCustomValidity(''); resetOpenBox(); }
      statusText.style.color = 'green';
      statusText.textContent = msg;
      loadList();
    } catch (error) {
      statusText.style.color = 'red';
      statusText.textContent = 'ত্রুটি হয়েছে: ' + error.message;
      console.error('Error!', error);
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadList();
</script>

</body>
</html>
